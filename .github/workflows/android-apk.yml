name: Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-33 ndk;25.2.9519653'

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/ndk/25.2.9519653"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: godarmxvpn-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: godarmxvpn Build ${{ github.run_number }}
          body: |
            Automated Android APK build.

            Commit: ${{ github.sha }}
            Workflow run: ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
